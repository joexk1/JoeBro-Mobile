name: JoeBroMobile
# Debug/Release = production. Debug-Personal/Release-Personal = the owner's build:
# PERSONAL compilation condition, Personal/Info.plist, personal bundle id (Config/Personal.xcconfig).
configs:
  Debug: debug
  Release: release
  Debug-Personal: debug
  Release-Personal: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  Debug-Personal: Config/Personal.xcconfig
  Release-Personal: Config/Personal.xcconfig
schemes:
  JoeBroMobile:
    build:
      targets:
        JoeBroMobile: all
    run: {config: Debug}
    archive: {config: Release}
  JoeBroMobile-Personal:
    build:
      targets:
        JoeBroMobile: all
    run: {config: Debug-Personal}
    archive: {config: Release-Personal}
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JoeBroMobile:
    type: application
    platform: iOS
    sources:
      - path: JoeBroMobile
        excludes:
          - AsciiScenes
      # Kept as a folder so the bundle URL lookup by subdirectory still works.
      - path: JoeBroMobile/AsciiScenes
        type: folder
      - path: Core
      - path: Personal
        excludes:
          - Info.plist
      - path: Features
      - path: Island/Shared
      - path: Island/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID)
        INFOPLIST_FILE: JoeBroMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: JoeBroMobile/JoeBroMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug-Personal:
          INFOPLIST_FILE: Personal/Info.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG PERSONAL"
        Release-Personal:
          INFOPLIST_FILE: Personal/Info.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL"
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.HealthKit:
          enabled: 1
    dependencies:
      - target: JoeBroIsland
        embed: true
      - target: JoeBroShare
        embed: true
  JoeBroIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: Island/Shared
      - path: Island/WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID).island
        INFOPLIST_FILE: Island/WidgetExtension/Info.plist
        SKIP_INSTALL: YES
  JoeBroShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/ShareViewController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID).share
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        SKIP_INSTALL: YES
