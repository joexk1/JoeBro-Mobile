name: JoeBroMobile
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JoeBroMobile:
    type: application
    platform: iOS
    sources:
      - path: JoeBroMobile
      - path: Core
      - path: Features
      - path: Island/Shared
      - path: Island/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID)
        INFOPLIST_FILE: JoeBroMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: JoeBroMobile/JoeBroMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    dependencies:
      - target: JoeBroIsland
        embed: true
      - target: JoeBroShare
        embed: true
  JoeBroIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: Island/Shared
      - path: Island/WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID).island
        INFOPLIST_FILE: Island/WidgetExtension/Info.plist
        SKIP_INSTALL: YES
  JoeBroShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/ShareViewController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOEBRO_BUNDLE_ID).share
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        SKIP_INSTALL: YES
